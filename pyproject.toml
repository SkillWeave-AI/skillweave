[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillweave"
version = "1.5.9"
description = "Multi-agent AI skill orchestration with Next Level features"
readme = "README.md"
authors = [
    {name = "LangeVC.com"},
]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    # The SDK owns the contract bytes (schemas + taxonomy value set). Core pins
    # an exact version and consumes the pinned artifact; it never copies the
    # schema authority into its own tree (see docs/architecture.md, "Repository
    # boundary", and tests/contract/test_preview_core_pro_boundary.py).
    "skillweave-sdk==0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    # The studio hook, licensing and reference suites are async and carry
    # `@pytest.mark.asyncio`. Without this plugin the mark is unknown, pytest
    # does not run the coroutine, and 32 tests fail with a warning rather than
    # an error — a red suite that looks like a code defect and is not.
    "pytest-asyncio>=0.23",
    "black>=23.0",
    "flake8>=6.0",
    "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/LangeVC/skillweave"
Repository = "https://github.com/LangeVC/skillweave"
Issues = "https://github.com/LangeVC/skillweave/issues"

[project.scripts]
skillweave-install = "skillweave.installer:main"
skillweave-risk-mode = "skillweave.scripts.resolve_risk_mode:main"
skillweave-interactive-mode = "skillweave.scripts.interactive_mode:main"
skillweave = "skillweave.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["skillweave*"]

[tool.setuptools]
py-modules = ["skillweave_degraded"]

[tool.setuptools.package-data]
skillweave = ["py.typed"]
"skillweave.assets" = ["catalogue.yaml", "profiles/**/*", "lenses/**/*", "prompts/**/*", "templates/**/*"]
"skillweave.studio.reference" = ["lean_startup.md"]
