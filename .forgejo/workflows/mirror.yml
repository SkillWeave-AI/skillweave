# unified-mirror.yml — single Mirror to GitHub workflow for every mirrored repo.
# Decided by ADR-0001 (lvc-ops, OPS-001). Deploy as `.forgejo/workflows/mirror.yml`
# verbatim in every repo that has one. The GitHub target is resolved from two
# Actions variables read via the `vars` context (no token, no API):
#   GH_REPO_OWNER  — org scope, the owning GitHub org/user (e.g. SkillWeave-AI)
#   GH_REPO        — repo scope, the full owner/name destination (e.g. SkillWeave-AI/skillweave)
# A preflight guard in the mirror job enforces the mapping contract in cost
# order — double match (string), existence (reachability), then permission
# (ownership) — and exports the vetted destination for the push steps. Nothing
# is pushed until all three hold.
#
# Two entry points:
#   1. push event  -> exact-ref: force-push ONLY the triggering ref.
#      This is the default, per-event copy. It never prunes, so it never
#      deletes the GitHub default branch or GitHub-managed refs.
#   2. workflow_dispatch -> STATE SYNC (no `ref`) or targeted exact-ref (with
#      `ref`). No `ref` means: clone --mirror the canonical source and force-push
#      ALL refs. The clone IS the health gate: if Forgejo cannot be read the step
#      fails and NO ref is touched. A `ref` narrows the run to a single
#      break-glass re-push of exactly that ref. Deletion propagation is a
#      separate, explicit mode below.
#
# Visibility gate (OPS-011 / CAP-CI-001): a `needs:`-preceding job that refuses
# to mirror a push touching planning/contract paths to a PUBLIC mirror. Forgejo
# Actions has no cross-workflow `needs:`; a separate workflow on the same trigger
# would race ahead of the gate. The gate is therefore a job INSIDE this workflow
# and the mirror job depends on it. Only within one workflow is ordering
# guaranteed. A deliberate release is unblockable via release_override with a
# mandatory reason; a gate with no way out gets bypassed, which is worse than no
# gate.
#
# Full-state per-ref gate (LVC-216): the visibility-gate job inspects only the
# dispatch ref, but the full-state push writes every canonical ref, so each ref
# is re-gated against BLOCKED_PATHS relative to its own merge-base before it
# may enter the push list. Blocked refs are dropped and reported with a
# ::warning::; there is deliberately no release_override on this path. The
# break-glass exact-ref push is NOT re-gated — it is a single manual ref that
# stays under the normal needs-gate only.
#
# Deletion propagation (OPS-005): pass `prune=true` on dispatch to synchronize
# deletions too. It is opt-in because a healthy-source gate is required before
# pruning anything from the mirror (ADR D.2 / D.3): the mirror is a recovery copy,
# so an unverified source must never be allowed to wipe it. Deleted refs are the
# ones present on GitHub (in the cloned mirror) but absent on the freshly cloned
# canonical state. These are always excluded from pruning, even under prune=true:
#   - the GitHub default branch (GitHub refuses to delete it -> job would fail)
#   - GitHub-managed refs: gh-pages and any 'refs/heads' matching the mirror-only
#     set declared per repo.
#
# Forgejo Actions secrets (org-level):
#   GH_MIRROR_TOKEN  — required. GitHub PAT with push access to the mirror.
#                      Name is fixed across orgs to keep mirror.yml identical.

name: Mirror to GitHub

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact ref to re-mirror (break-glass). Empty = full state sync. Example: refs/tags/v2.3.0"
        required: false
        default: ""
        type: string
      prune:
        description: "true = also delete GitHub refs absent on Forgejo (OPS-005, health-gated). false = catch-up only."
        required: false
        default: "false"
        type: boolean
      release_override:
        description: "Override the visibility gate (true). Public-mirror pushes only."
        required: false
        default: false
        type: boolean
      release_override_reason:
        description: "Mandatory reason when release_override=true. Recorded in the log."
        required: false
        type: string

# Paths that carry planning/strategy content and must not reach the PUBLIC mirror.
# A hit turns the push red unless a release_override with a mandatory reason is
# present. Taken verbatim from the running gate on skillweave
# (chore/OPS-sichtbarkeit-purge), the only working instance measured.
#   - .skillweave/**          : planning/dogfooding state; planning belongs in
#                               the Forgejo-only planning repo.
#   - **/strategy.md          : gitignored, never versioned.
#   - **/prd*.md, json        : PRDs belong in the planning repo.
#   - **/*.contract*          : Open-Core/economic contracts (GLE-004 case).
#   - **/*contract*.md, *proposal*.md : contracts/proposals that escape INTO
#                               docs/ where no path gate caught them. The
#                               GLE-004 contract was docs/repo-vierteilung-contract.md
#                               — exactly this '-contract.md' form was uncovered in
#                               every earlier version. This is why docs/ is
#                               covered indirectly: the contract/proposal CLASS is
#                               blocked wherever it lands, while docs/ itself stays
#                               free for public product docs (architecture, roadmap).
env:
  BLOCKED_PATHS: ".skillweave/**|strategy.md|**/strategy.md|prd*.md|**/prd*.md|prd*.json|**/prd*.json|*.contract*|**/*.contract*|*contract*.md|**/*contract*.md|*proposal*.md|**/*proposal*.md|*.proposal*|**/*.proposal*"

# The GitHub destination comes from TWO Actions variables, read through the
# `vars` context: GH_REPO_OWNER at org scope and GH_REPO at repo scope. The
# preflight guard enforces the mapping contract in cost order — double match
# (string), existence (reachability), then permission (ownership) — and only then
# exports the vetted destination for the push and dispatch steps. An unset
# variable, a pair that drifted apart, a nonexistent destination, or a
# destination the token may not push to all fail at that named preflight step —
# never as a git exit 128 from inside a push.

jobs:
  # --- Gate: runs BEFORE the mirror. The mirror depends on it via needs:. ---
  visibility-gate:
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate — visibility of pushed paths
        id: gate
        env:
          GH_RELEASE_OVERRIDE: ${{ inputs.release_override }}
          GH_RELEASE_REASON: ${{ inputs.release_override_reason || '' }}
          GH_BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          echo "release_override: ${GH_RELEASE_OVERRIDE:-false}"
          echo "release_override_reason: ${GH_RELEASE_REASON:-<none>}"

          # Diff base.
          # - Existing ref: the push payload's `before` SHA (what this push changed).
          # - New ref (before is 0000... or empty): `before` is ALWAYS null on a
          #   new branch, so "start from the checkout root" would diff the whole
          #   repo history and reject a branch that never touched a blocked path
          #   (LVC-214). The meaningful base is the fork point: merge-base of the
          #   default branch and HEAD, i.e. only what THIS branch builds on top of
          #   its parent. Root stays as the fallback for the no-common-history
          #   case (orphan branch / first push of a fresh repo).
          if [ "${GH_BEFORE}" = "0000000000000000000000000000000000000000" ] \
             || [ -z "${GH_BEFORE}" ]; then
            # Default branch name is not exposed in the push context; determine it
            # instead of assuming "main". origin/HEAD is set on a full clone/fetch;
            # fall back to the remote's declared HEAD, then to "main" (fail closed:
            # a wrong guess yields an empty merge-base -> root fallback -> a
            # conservative whole-tree diff, never a bypass).
            # `|| true` is not decoration: the step runs under the default
            # shell `bash -eo pipefail`, which this script's own `set -uo
            # pipefail` does NOT relax. On a fresh actions/checkout there is no
            # origin/HEAD, so `git symbolic-ref` exits 128 and, without the
            # guard, kills the whole gate before it ever computes a base
            # (LVC-214, run 39: died 1s in, right after the two echoes above).
            default_branch="$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's#^refs/remotes/origin/##' || true)"
            if [ -z "${default_branch}" ]; then
              default_branch="$(git ls-remote --symref origin HEAD 2>/dev/null | sed -n '1s/^ref: refs\/heads\/\([^[:space:]]*\).*/\1/p' || true)"
            fi
            if [ -z "${default_branch}" ]; then
              default_branch="main"
            fi
            echo "default branch: ${default_branch}"
            # Ensure the default-branch tip is a local ref so merge-base is
            # meaningful (checkout may only have fetched the triggering ref).
            git fetch --no-tags --force origin "refs/heads/${default_branch}:refs/remotes/origin/${default_branch}" >/dev/null 2>&1 || true
            base="$(git merge-base "origin/${default_branch}" HEAD 2>/dev/null || true)"
            if [ -z "${base}" ]; then
              base="$(git rev-list --max-parents=0 HEAD)"
            fi
          else
            base="${GH_BEFORE}"
          fi
          echo "diff base: ${base}"

          touched="$RUNNER_TEMP/touched.txt"
          # `|| true` keeps the diff-tree fallback below REACHABLE. Under the
          # default `bash -eo pipefail` a failing diff (empty or unusable base)
          # would kill the step instead, and the fallback that exists exactly
          # for that case would never run.
          git diff --name-only "${base}" HEAD > "${touched}" || true
          if [ ! -s "${touched}" ]; then
            git diff-tree --no-commit-id --name-only -r HEAD > "${touched}"
          fi
          echo "touched files: $(wc -l < "${touched}")"

          IFS='|' read -ra GLOBS <<< "$BLOCKED_PATHS"

          blocked=""
          while IFS= read -r f; do
            [ -z "${f}" ] && continue
            for g in "${GLOBS[@]}"; do
              case "${f}" in
                ${g}) blocked="${blocked} ${f}" ;;
              esac
            done
          done < "${touched}"

          if [ -z "${blocked}" ]; then
            echo "Gate PASS — no planning/strategy paths touched."
            echo "decision=PASS" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "GATE FAIL — the following paths carry planning/strategy content:"
          printf '  %s\n' ${blocked}

          override="${GH_RELEASE_OVERRIDE:-false}"
          if [ "${override}" = "true" ] && [ -n "${GH_RELEASE_REASON}" ]; then
            echo "Release-override ACTIVATED. Reason: ${GH_RELEASE_REASON}"
            echo "decision=OVERRIDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${override}" = "true" ] && [ -z "${GH_RELEASE_REASON}" ]; then
            echo "Release-override requires a mandatory reason (release_override_reason)."
            echo "decision=FAIL" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Push to the public mirror blocked. Resolve the incident (planning"
          echo "content belongs in the Forgejo-only planning repo) or use"
          echo "workflow_dispatch with release_override + mandatory reason."
          echo "decision=FAIL" >> "$GITHUB_OUTPUT"
          exit 1

  # --- Version gate (BUG-010): the mirror used to race the release-tag version
  # check. validate-release-tag.yml lived in a separate workflow, and Forgejo
  # has no cross-workflow needs:, so a v* tag whose source_of_truth version
  # disagreed with the tag reached GitHub regardless. The check now lives INSIDE
  # this workflow and is ordered ahead of the mirror job via needs: — the only
  # ordering Forgejo honours across a gate and a push. This keeps ADR-0001's
  # single mirror file. Unlike capacium (inline tomllib against pyproject.toml),
  # skillweave's authority is .version.yaml (16 locations) and the manifest
  # cross-check; both checks move here verbatim from validate-release-tag.yml. ---
  version-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

      - name: Fetch version-sync.py (canonical, ops-engine)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          # Generic tooling lives in the open base (LVC-221). ops-engine is
          # OSS and publicly mirrored, so this needs no credential and works
          # identically from every org — the private lvc-ops URL did not.
          #
          # The fetch is PINNED to a tag, not master. A gate that does not bump
          # must not follow a moving branch: master could carry a version-sync.py
          # change that changes what "in sync" means between two releases of this
          # repo. The pin is v3.4.2, the same release the release workflow installs
          # as its engine, so this repository names one ops-engine version and not
          # two. version-sync.py is byte-identical across v3.0.0, v3.4.0 and
          # v3.4.2, so the gate decides exactly what it decided before.
          curl -fsSL \
            "https://raw.githubusercontent.com/LangeVC/ops-engine/v3.4.2/scripts/version-sync.py" \
            -o "$RUNNER_TEMP/version-sync.py"

          # Prove what arrived. Without this the step reports success even
          # when it fetched an HTML login page: a private raw URL answers 303
          # to /user/login, curl -L follows, the login page returns 200, and
          # -f never triggers. That is how the first live run of this gate
          # died three steps later on "SyntaxError: <!DOCTYPE html>".
          python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" \
            "$RUNNER_TEMP/version-sync.py" \
            || { echo "fetched file is not Python — first three lines:"; \
                 head -3 "$RUNNER_TEMP/version-sync.py"; exit 1; }
          # Prove the pinned tag carries the bump subcommand the release path
          # depends on (DEVELOPMENT_WORKFLOW.md "Release Process"). A tag whose
          # version-sync.py lost `bump` silently removes the ability to write
          # every declared location before the tag gate runs.
          python3 "$RUNNER_TEMP/version-sync.py" bump --help >/dev/null \
            || { echo "pinned version-sync.py has no 'bump' subcommand"; exit 1; }

          echo "VERSION_SYNC=$RUNNER_TEMP/version-sync.py" >> "$GITHUB_ENV"

      - name: Gate — locations (a/b) and tag == source_of_truth (c)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          # check-tag vergleicht den Tag gegen source_of_truth OHNE v-Praefix.
          python3 "$VERSION_SYNC" check-tag "${GITHUB_REF_NAME#v}" --repo .

      - name: Gate — capabilities manifest == member files (case 4)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 scripts/check-manifest.py --repo .

  mirror:
    needs: [visibility-gate, version-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the triggering ref (needed for the event-path push)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Preflight guard: enforce the mapping contract before any push.
      # Reads GH_REPO_OWNER (org scope) and GH_REPO (repo scope) through the
      # `vars` context. Runs the ops-engine MirrorHandler.prove_destination
      # proof in cost order:
      #   1. presence  (either unset -> named error naming the variable + scope)
      #   2. DOUBLE MATCH  (GH_REPO owner prefix == GH_REPO_OWNER, case-sensitive)
      #      A pure string comparison, runs BEFORE any call to GitHub.
      #   3. existence (real git ls-remote reachability)
      #   4. permission (permissions.push for the mirror token)
      #   5. exact identity (full_name, repository id, visibility) when
      #      GH_EXPECTED_VISIBILITY / GH_EXPECTED_REPOSITORY_ID are set.
      # Each failure exits 1 at this named step, before any push. On success the
      # vetted destination is exported as GH_REPO for the push/dispatch steps.
      - name: Preflight — resolve, double-match, verify, and vouch for the destination
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GH_REPO_OWNER: ${{ vars.GH_REPO_OWNER }}
          GH_REPO: ${{ vars.GH_REPO }}
          GH_EXPECTED_VISIBILITY: ${{ vars.GH_EXPECTED_VISIBILITY }}
          GH_EXPECTED_REPOSITORY_ID: ${{ vars.GH_EXPECTED_REPOSITORY_ID }}
        run: |
          set -euo pipefail

          owner="${GH_REPO_OWNER:-}"
          repo="${GH_REPO:-}"

          # 1. Presence — either missing is a named error, before any network.
          if [ -z "${owner}" ]; then
            echo "::error::preflight: GH_REPO_OWNER is UNSET. Set the ORG-level Actions variable GH_REPO_OWNER to the GitHub org/user that owns the mirror (e.g. SkillWeave-AI)."
            exit 1
          fi
          if [ -z "${repo}" ]; then
            echo "::error::preflight: GH_REPO is UNSET. Set the REPOSITORY-level Actions variable GH_REPO to the full destination (owner/repo, e.g. SkillWeave-AI/skillweave)."
            exit 1
          fi
          echo "preflight: GH_REPO_OWNER='${owner}'  GH_REPO='${repo}'"

          # 2. Double match — pure string comparison, BEFORE any GitHub request.
          #    Catches the most likely drift: a pair whose prefix has strayed.
          repo_owner="${repo%%/*}"
          if [ "${repo_owner}" != "${owner}" ]; then
            echo "::error::preflight: DOUBLE MATCH failed — GH_REPO '${repo}' has owner prefix '${repo_owner}', but GH_REPO_OWNER is '${owner}' (case-sensitive)."
            echo "::error::Correct one of the two variables so GH_REPO's owner prefix equals GH_REPO_OWNER exactly. Refusing to push; no GitHub request was made."
            exit 1
          fi
          echo "preflight: double match OK — owner prefix '${repo_owner}' == GH_REPO_OWNER '${owner}'"

          # 3-5. Python proof: EXISTS, IS OURS, and exact identity.
          # Uses ops-engine MirrorHandler.prove_destination which accepts
          # optional expected_visibility and expected_repository_id.
          python3 - "${repo}" "${GH_MIRROR_TOKEN:-}" "${GH_EXPECTED_VISIBILITY:-}" "${GH_EXPECTED_REPOSITORY_ID:-}" <<'PROVE_PY'
          import asyncio, os, sys
          from ops_engine.modules.mirror import MirrorHandler, MirrorDestinationError

          async def main():
              destination = sys.argv[1]
              token = sys.argv[2] if sys.argv[2] else None
              visibility = sys.argv[3] if sys.argv[3] else None
              repo_id_str = sys.argv[4]
              repo_id = int(repo_id_str) if repo_id_str else None

              try:
                  await MirrorHandler.prove_destination(
                      destination,
                      token=token,
                      expected_visibility=visibility,
                      expected_repository_id=repo_id,
                  )
              except MirrorDestinationError as exc:
                  print(f"::error::preflight: {exc}", file=sys.stderr)
                  sys.exit(1)

          asyncio.run(main())
          PROVE_PY

          echo "preflight: '${repo}' is reachable, writable, and identity verified."

          # Export the vetted destination so the push steps push exactly what
          # this step vouched for.
          echo "GH_REPO=${repo}" >> "$GITHUB_ENV"
          echo "GH_REPO_OWNER=${owner}" >> "$GITHUB_ENV"

      - name: Push triggering ref to GitHub mirror (exact-ref, event path)
        if: github.event_name == 'push'
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GH_REPO: ${{ env.GH_REPO }}
          MIRROR_DECISION: ${{ needs.visibility-gate.outputs.decision }}
        run: |
          echo "Gate decision: ${MIRROR_DECISION} (OVERRIDE = recorded release)"
          remote="https://x-access-token:${GH_MIRROR_TOKEN}@github.com/${GH_REPO}.git"
          git push --force "$remote" "+${GITHUB_REF}:${GITHUB_REF}"

      - name: Dispatch — targeted exact-ref (break-glass) or full state sync
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          FORGEJO_TOKEN: ${{ github.token }}
          GH_REPO: ${{ env.GH_REPO }}
          PRUNE: ${{ github.event.inputs.prune }}
          REF: ${{ github.event.inputs.ref }}
          MIRROR_DECISION: ${{ needs.visibility-gate.outputs.decision }}
        run: |
          set -euo pipefail
          # LVC-214b: assemble the GitHub remote INSIDE the shell, where
          # ${GH_REPO}/${GH_MIRROR_TOKEN} resolve from the step env. An
          # env:-level TARGET literal is NOT re-interpolated, so it baked the
          # literal "${GH_REPO}" into the URL and every clone/push hit
          # github.com/${GH_REPO}.git -> Not Found.
          TARGET="https://x-access-token:${GH_MIRROR_TOKEN}@github.com/${GH_REPO}.git"
          # A `ref` narrows a dispatch to one break-glass re-push of exactly that
          # ref (recorded gate decision above). It never prunes: pruning is only
          # ever the full-state path further down, which is health-gated by the
          # clone. An empty `ref` falls through to the full state sync below.
          if [ -n "${REF}" ]; then
            echo "Gate decision: ${MIRROR_DECISION} (OVERRIDE = recorded release)"
            git push --force "$TARGET" "+${REF}:${REF}"
            exit 0
          fi

          tmp="$(mktemp -d)"
          # Health gate: if the canonical source is not readable the clone fails
          # and we touch nothing. The mirror is a recovery copy; we never prune
          # from an unverified source (ADR D.2/D.3).
          git clone --mirror "http://x-access-token:${FORGEJO_TOKEN}@forgejo:3000/${{ github.repository }}.git" "$tmp/s.git"
          git clone --mirror "$TARGET" "$tmp/d.git" 2>/dev/null || true

          # --- FULL-STATE SYNC — per-ref blocked-path gate (LVC-216 / OPS-011).
          # The clone above is the health gate, but it is NOT a visibility
          # gate: on a state-sync dispatch the needs: visibility-gate job only
          # inspected the dispatch ref (usually a clean `main`), while this push
          # writes EVERY canonical ref — including branches that carry
          # planning/contract content (e.g. proof/lvc214-blocked-* with
          # docs/proof-contract*.md). A `needs:` edge orders the runs; it does
          # not make the inspected object equal to the written one. So each ref
          # is re-gated here against BLOCKED_PATHS before it may enter the push
          # list. A blocked ref is DROPPED from the push and reported with a
          # ::warning:: (never a silent skip). There is deliberately NO
          # release_override on this path: a bulk state sync must not whitelist
          # individual refs — the rule is strict, blocked means excluded.

          # Default branch from the mirror clone's HEAD symref (a --mirror clone
          # sets HEAD to the source's default). Fall back to main/master, then to
          # a hardcoded "main" (fail closed: a wrong guess only widens what the
          # merge-base diff reports, never a bypass).
          default_branch="$(git -C "$tmp/s.git" symbolic-ref --short HEAD 2>/dev/null || true)"
          if [ -z "${default_branch}" ]; then
            default_branch="$(git -C "$tmp/s.git" for-each-ref --format='%(refname:short)' refs/heads/main refs/heads/master 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "${default_branch}" ]; then
            default_branch="main"
          fi
          echo "default branch: ${default_branch}"

          IFS='|' read -ra GLOBS <<< "$BLOCKED_PATHS"

          push_specs=()
          blocked_count=0
          while IFS= read -r _ref; do
            [ -z "${_ref}" ] && continue

            # A ref is blocked iff it changes blocked paths RELATIVE TO ITS OWN
            # base — not against the default branch's whole tree. A branch that
            # never forked from main would otherwise diff against the wrong
            # history (or come out empty), and an empty diff would let a blocked
            # branch through. Base = merge-base(default, ref), root fallback for
            # orphan/fresh branches — the same logic the visibility-gate job
            # already runs and has measured to work.
            commit="$(git -C "$tmp/s.git" rev-parse "${_ref}^{commit}" 2>/dev/null || true)"
            if [ -z "${commit}" ]; then
              # Non-commit ref (tag on a blob/tree): no diff to gate, keep it.
              push_specs+=("+${_ref}:${_ref}")
              continue
            fi
            base="$(git -C "$tmp/s.git" merge-base "refs/heads/${default_branch}" "${commit}" 2>/dev/null || true)"
            if [ -z "${base}" ]; then
              base="$(git -C "$tmp/s.git" rev-list --max-parents=0 "${commit}" 2>/dev/null || true)"
            fi

            # diff-tree against the LOCAL base SHA (no network, no working tree
            # — the mirror clone is bare). One diff-tree per ref = O(files this
            # ref changed), not O(refs^2).
            matches=""
            while IFS= read -r f; do
              [ -z "${f}" ] && continue
              for g in "${GLOBS[@]}"; do
                case "${f}" in
                  ${g}) matches="${matches} ${f}" ;;
                esac
              done
            done < <(git -C "$tmp/s.git" diff-tree --no-commit-id --name-only -r "${base}" "${commit}" 2>/dev/null || true)

            if [ -n "${matches}" ]; then
              blocked_count=$((blocked_count + 1))
              printf '::warning::state-sync: EXCLUDING %s — blocked path(s):%s\n' "${_ref}" "${matches}"
              continue
            fi
            push_specs+=("+${_ref}:${_ref}")
          done < <(git -C "$tmp/s.git" for-each-ref --format='%(refname)' refs/heads refs/tags)

          if [ "${blocked_count}" -gt 0 ]; then
            printf '::warning::state-sync: %d ref(s) dropped by the blocked-path gate; not pushed to the public mirror\n' "${blocked_count}"
          fi

          # Always push every canonical ref that PASSED the gate (catch-up; no
          # prune by default). The wildcard is gone by design: the explicit list
          # is what keeps a blocked ref out of the push.
          if [ "${#push_specs[@]}" -gt 0 ]; then
            git -C "$tmp/s.git" push --force "$TARGET" "${push_specs[@]}"
          else
            echo "state-sync: no refs passed the gate; nothing pushed"
          fi

          # Git list of refs to DELETE from the mirror. A ref blocked by the
          # gate above is still PRESENT on canonical (it was only excluded from
          # the push, not removed), so the "absent on canonical" check below
          # leaves it untouched — a blocked-but-alive canonical ref is never
          # pruned.
          if [ "${PRUNE:-false}" = "true" ]; then
            deletes=()
            while IFS= read -r _ref; do
              case "$_ref" in
                # never delete the GitHub default branch, the dev branch, or
                # GitHub-managed refs (gh-pages). main and dev are both protected
                # so a faulty source can never wipe the long-lived integration or
                # release line.
                refs/heads/main|refs/heads/master|refs/heads/dev|refs/heads/gh-pages) continue ;;
              esac
              # delete only refs PRESENT on the mirror but ABSENT on canonical
              if git -C "$tmp/d.git" rev-parse --verify "$_ref" >/dev/null 2>&1 && \
                 ! git -C "$tmp/s.git" rev-parse --verify "$_ref" >/dev/null 2>&1; then
                deletes+=(":$_ref")
                echo "::notice::prune: ${_ref} deleted on Forgejo, removing from mirror"
              fi
            done < <(git -C "$tmp/d.git" for-each-ref --format='%(refname)' refs/heads refs/tags)

            if [ "${#deletes[@]}" -gt 0 ]; then
              git -C "$tmp/s.git" push --force "$TARGET" "${deletes[@]}"
            else
              echo "prune: no refs to delete"
            fi
          fi
          rm -rf "$tmp"
