# Forgejo (git.langevc.com) is canonical. GitHub (SkillWeave-AI/skillweave) is a
# read-only mirror. Force-push ONLY the ref that triggered this run (branch or
# tag). No --prune and no 'refs/heads/*' wildcard: the CI checkout only has this
# one ref locally, so a pruning wildcard push would try to delete every OTHER
# branch on the mirror -- including GitHub's default branch (which GitHub
# refuses, failing the job) and any GitHub-managed branch such as gh-pages.
# Pushing only ${GITHUB_REF} keeps the mirror in sync and leaves those untouched.
# Unified pattern (see lvc-ops/docs/release-flow.md).
#
# REL-010 -- this workflow mirrors git refs ONLY. It used to also derive the
# GitHub release object from the canonical Forgejo release by downloading the
# four release assets over the network and re-uploading them (REL-004), waiting
# under a hard bound for the canonical release to appear (REL-009). That release
# logic is gone: the build in forgejo-release.yml now publishes its four assets
# to BOTH forges from its own workspace, so there is nothing to wait for and
# nothing to re-download here. This file keeps exactly the force-push below,
# unchanged in intent.
#
# ADP-009 -- the repository this workflow pushes to is a destination, so it must
# come from the committed config layer, never from this file as a literal. The
# GitHub destination is read out of `.ops.yaml` below (stdlib only, REL-006:
# this job carries neither yaml nor pydantic and installs nothing). The
# credential stays where it belongs: GH_MIRROR_TOKEN is a secret (a credential,
# not a destination) and is never copied into `.ops.yaml`, which carries the
# repository only.
name: Mirror to GitHub

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact ref to re-mirror (break-glass). Empty = full state sync. Example: refs/tags/v2.3.0"
        required: false
        default: ""
        type: string
      prune:
        description: "true = also delete GitHub refs absent on Forgejo (OPS-005, health-gated). false = catch-up only."
        required: false
        default: "false"
        type: boolean
      release_override:
        description: "Override the visibility gate (true). Public-mirror pushes only."
        required: false
        default: false
        type: boolean
      release_override_reason:
        description: "Mandatory reason when release_override=true. Recorded in the log."
        required: false
        type: string

# Paths that carry planning/strategy content and must not reach the PUBLIC mirror.
# A hit turns the push red unless a release_override with a mandatory reason is
# present. Taken verbatim from the running gate on skillweave
# (chore/OPS-sichtbarkeit-purge), the only working instance measured.
#   - .skillweave/**          : planning/dogfooding state; planning belongs in
#                               the Forgejo-only planning repo.
#   - **/strategy.md          : gitignored, never versioned.
#   - **/prd*.md, json        : PRDs belong in the planning repo.
#   - **/*.contract*          : Open-Core/economic contracts (GLE-004 case).
#   - **/*contract*.md, *proposal*.md : contracts/proposals that escape INTO
#                               docs/ where no path gate caught them. The
#                               GLE-004 contract was docs/repo-vierteilung-contract.md
#                               — exactly this '-contract.md' form was uncovered in
#                               every earlier version. This is why docs/ is
#                               covered indirectly: the contract/proposal CLASS is
#                               blocked wherever it lands, while docs/ itself stays
#                               free for public product docs (architecture, roadmap).
env:
  BLOCKED_PATHS: ".skillweave/**|strategy.md|**/strategy.md|prd*.md|**/prd*.md|prd*.json|**/prd*.json|*.contract*|**/*.contract*|*contract*.md|**/*contract*.md|*proposal*.md|**/*proposal*.md|*.proposal*|**/*.proposal*"

jobs:
  # --- Gate: runs BEFORE the mirror. The mirror depends on it via needs:. ---
  visibility-gate:
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate — visibility of pushed paths
        id: gate
        env:
          GH_RELEASE_OVERRIDE: ${{ inputs.release_override }}
          GH_RELEASE_REASON: ${{ inputs.release_override_reason || '' }}
          GH_BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          echo "release_override: ${GH_RELEASE_OVERRIDE:-false}"
          echo "release_override_reason: ${GH_RELEASE_REASON:-<none>}"

          # Diff base.
          # - Existing ref: the push payload's `before` SHA (what this push changed).
          # - New ref (before is 0000... or empty): `before` is ALWAYS null on a
          #   new branch, so "start from the checkout root" would diff the whole
          #   repo history and reject a branch that never touched a blocked path
          #   (LVC-214). The meaningful base is the fork point: merge-base of the
          #   default branch and HEAD, i.e. only what THIS branch builds on top of
          #   its parent. Root stays as the fallback for the no-common-history
          #   case (orphan branch / first push of a fresh repo).
          if [ "${GH_BEFORE}" = "0000000000000000000000000000000000000000" ] \
             || [ -z "${GH_BEFORE}" ]; then
            # Default branch name is not exposed in the push context; determine it
            # instead of assuming "main". origin/HEAD is set on a full clone/fetch;
            # fall back to the remote's declared HEAD, then to "main" (fail closed:
            # a wrong guess yields an empty merge-base -> root fallback -> a
            # conservative whole-tree diff, never a bypass).
            # `|| true` is not decoration: the step runs under the default
            # shell `bash -eo pipefail`, which this script's own `set -uo
            # pipefail` does NOT relax. On a fresh actions/checkout there is no
            # origin/HEAD, so `git symbolic-ref` exits 128 and, without the
            # guard, kills the whole gate before it ever computes a base
            # (LVC-214, run 39: died 1s in, right after the two echoes above).
            default_branch="$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's#^refs/remotes/origin/##' || true)"
            if [ -z "${default_branch}" ]; then
              default_branch="$(git ls-remote --symref origin HEAD 2>/dev/null | sed -n '1s/^ref: refs\/heads\/\([^[:space:]]*\).*/\1/p' || true)"
            fi
            if [ -z "${default_branch}" ]; then
              default_branch="main"
            fi
            echo "default branch: ${default_branch}"
            # Ensure the default-branch tip is a local ref so merge-base is
            # meaningful (checkout may only have fetched the triggering ref).
            git fetch --no-tags --force origin "refs/heads/${default_branch}:refs/remotes/origin/${default_branch}" >/dev/null 2>&1 || true
            base="$(git merge-base "origin/${default_branch}" HEAD 2>/dev/null || true)"
            if [ -z "${base}" ]; then
              base="$(git rev-list --max-parents=0 HEAD)"
            fi
          else
            base="${GH_BEFORE}"
          fi
          echo "diff base: ${base}"

          touched="$RUNNER_TEMP/touched.txt"
          # `|| true` keeps the diff-tree fallback below REACHABLE. Under the
          # default `bash -eo pipefail` a failing diff (empty or unusable base)
          # would kill the step instead, and the fallback that exists exactly
          # for that case would never run.
          git diff --name-only "${base}" HEAD > "${touched}" || true
          if [ ! -s "${touched}" ]; then
            git diff-tree --no-commit-id --name-only -r HEAD > "${touched}"
          fi
          echo "touched files: $(wc -l < "${touched}")"

          IFS='|' read -ra GLOBS <<< "$BLOCKED_PATHS"

          blocked=""
          while IFS= read -r f; do
            [ -z "${f}" ] && continue
            for g in "${GLOBS[@]}"; do
              case "${f}" in
                ${g}) blocked="${blocked} ${f}" ;;
              esac
            done
          done < "${touched}"

          if [ -z "${blocked}" ]; then
            echo "Gate PASS — no planning/strategy paths touched."
            echo "decision=PASS" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "GATE FAIL — the following paths carry planning/strategy content:"
          printf '  %s\n' ${blocked}

          override="${GH_RELEASE_OVERRIDE:-false}"
          if [ "${override}" = "true" ] && [ -n "${GH_RELEASE_REASON}" ]; then
            echo "Release-override ACTIVATED. Reason: ${GH_RELEASE_REASON}"
            echo "decision=OVERRIDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${override}" = "true" ] && [ -z "${GH_RELEASE_REASON}" ]; then
            echo "Release-override requires a mandatory reason (release_override_reason)."
            echo "decision=FAIL" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Push to the public mirror blocked. Resolve the incident (planning"
          echo "content belongs in the Forgejo-only planning repo) or use"
          echo "workflow_dispatch with release_override + mandatory reason."
          echo "decision=FAIL" >> "$GITHUB_OUTPUT"
          exit 1

  # --- Version gate (BUG-010): the mirror used to race the release-tag version
  # check. validate-release-tag.yml lived in a separate workflow, and Forgejo
  # has no cross-workflow needs:, so a v* tag whose source_of_truth version
  # disagreed with the tag reached GitHub regardless. The check now lives INSIDE
  # this workflow and is ordered ahead of the mirror job via needs: — the only
  # ordering Forgejo honours across a gate and a push. This keeps ADR-0001's
  # single mirror file. Unlike capacium (inline tomllib against pyproject.toml),
  # skillweave's authority is .version.yaml (16 locations) and the manifest
  # cross-check; both checks move here verbatim from validate-release-tag.yml. ---
  version-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

      - name: Fetch version-sync.py (canonical, ops-engine)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          # Generic tooling lives in the open base (LVC-221). ops-engine is
          # OSS and publicly mirrored, so this needs no credential and works
          # identically from every org — the private lvc-ops URL did not.
          #
          # The fetch is PINNED to a tag, not master. A gate that does not bump
          # must not follow a moving branch: master could carry a version-sync.py
          # change that changes what "in sync" means between two releases of this
          # repo. The pin is v3.4.2, the same release the release workflow installs
          # as its engine, so this repository names one ops-engine version and not
          # two. version-sync.py is byte-identical across v3.0.0, v3.4.0 and
          # v3.4.2, so the gate decides exactly what it decided before.
          curl -fsSL \
            "https://raw.githubusercontent.com/LangeVC/ops-engine/v3.4.2/scripts/version-sync.py" \
            -o "$RUNNER_TEMP/version-sync.py"

          # Prove what arrived. Without this the step reports success even
          # when it fetched an HTML login page: a private raw URL answers 303
          # to /user/login, curl -L follows, the login page returns 200, and
          # -f never triggers. That is how the first live run of this gate
          # died three steps later on "SyntaxError: <!DOCTYPE html>".
          python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" \
            "$RUNNER_TEMP/version-sync.py" \
            || { echo "fetched file is not Python — first three lines:"; \
                 head -3 "$RUNNER_TEMP/version-sync.py"; exit 1; }
          # Prove the pinned tag carries the bump subcommand the release path
          # depends on (DEVELOPMENT_WORKFLOW.md "Release Process"). A tag whose
          # version-sync.py lost `bump` silently removes the ability to write
          # every declared location before the tag gate runs.
          python3 "$RUNNER_TEMP/version-sync.py" bump --help >/dev/null \
            || { echo "pinned version-sync.py has no 'bump' subcommand"; exit 1; }

          echo "VERSION_SYNC=$RUNNER_TEMP/version-sync.py" >> "$GITHUB_ENV"

      - name: Gate — locations (a/b) and tag == source_of_truth (c)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          # check-tag vergleicht den Tag gegen source_of_truth OHNE v-Praefix.
          python3 "$VERSION_SYNC" check-tag "${GITHUB_REF_NAME#v}" --repo .

      - name: Gate — capabilities manifest == member files (case 4)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 scripts/check-manifest.py --repo .

  mirror:
    needs: [visibility-gate, version-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to GitHub mirror
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          mirror_repo="$(
            python3 - <<'PY'
          import sys

          def _clean_scalar(raw):
              """Strip YAML quoting/inline-comment then flag anything leftover.

              The real loader (config_loader.load_ops_yaml) accepts forms this
              line-scan cannot parse: a single- or double-quoted scalar, and an
              inline comment after a value. Rather than pass the raw bytes
              (quotes, trailing comment) into a push remote that git then
              rejects with an obscure error, this mirror strips the exact YAML
              wrapping it understands and, when wrapping it does NOT understand
              remains, refuses by name instead of guessing.
              """
              v = raw.strip()
              if len(v) >= 2 and v[0] == v[-1] and v[0] in "\"'":
                  v = v[1:-1].strip()
              marker = None
              if v and v[0] in "\"'":
                  marker = "an unmatched quote"
              elif "#" in v:
                  rest = v.split("#", 1)[1]
                  if rest.strip():
                      marker = "an inline comment"
              if marker:
                  return "", marker
              return v, None

          # Strict, refusal-first scan of `.ops.yaml` for the github destination.
          #
          # This workflow is install-free (REL-010 keeps the mirror a bare force-push,
          # and REL-006 keeps the bare runner free of yaml/pydantic), so it cannot call
          # config_loader.load_ops_yaml here. It reads ONLY the rigid `destinations`
          # list that the committed `.ops.yaml` declares, and REFUSES (never guesses)
          # the moment the file uses a form this scan does not understand. The forms
          # it understands and strips are YAML scalar quoting and an inline comment;
          # any wrapping left over after that is refused by name rather than passed
          # as raw bytes into a push remote (see _clean_scalar) or guessed at.
          indent = None
          git_repos = []
          with open(".ops.yaml", "r", encoding="utf-8") as fh:
              in_destinations = False
              cur = {}
              cur_indent = None
              for lineno, raw in enumerate(fh, start=1):
                  line = raw.rstrip("\n")
                  stripped = line.strip()
                  if not stripped or stripped.startswith("#"):
                      continue
                  pad = len(line) - len(line.lstrip(" "))
                  if in_destinations and stripped == "destinations:":
                      raise LookupError("nested destinations is not supported")
                  if not in_destinations and stripped == "destinations:":
                      in_destinations = True
                      indent = pad
                      continue
                  if not in_destinations:
                      continue
                  if pad <= indent:
                      break
                  if stripped.startswith("- "):
                      if cur and cur.get("forge") == "github":
                          git_repos.append(cur["repo"])
                      cur = {}
                      cur_indent = pad
                      field = stripped[2:]
                      if ":" not in field:
                          raise LookupError("unexpected destinations sequence entry")
                      key, _, value = field.partition(":")
                      if key not in ("forge", "repo", "role", "visibility"):
                          raise LookupError("unknown destination field: %r" % key)
                      value, marker = _clean_scalar(value)
                      if marker:
                          sys.stderr.write(
                              "MirrorDestinationBoundaryError: .ops.yaml destination value "
                              "at line %d carries %s; this mirror does not parse YAML and "
                              "cannot be sure which repo it pushes to. Refusing to "
                              "guess a push remote over one a reviewer did not see.\n"
                              % (lineno, marker)
                          )
                          sys.exit(2)
                      cur[key] = value
                  else:
                      if cur_indent is None or pad <= cur_indent:
                          raise LookupError(
                              "unexpected destinations indentation at line %d" % lineno
                          )
                      key, _, value = stripped.partition(":")
                      if ":" not in stripped or not value.strip():
                          raise LookupError(
                              "destination value must be `key: value` at line %d" % lineno
                          )
                      if key not in ("forge", "repo", "role", "visibility"):
                          raise LookupError("unknown destination field: %r" % key)
                      value, marker = _clean_scalar(value)
                      if marker:
                          sys.stderr.write(
                              "MirrorDestinationBoundaryError: .ops.yaml destination value "
                              "at line %d carries %s; this mirror does not parse YAML and "
                              "cannot be sure which repo it pushes to. Refusing to "
                              "guess a push remote over one a reviewer did not see.\n"
                              % (lineno, marker)
                          )
                          sys.exit(2)
                      cur[key] = value
              if in_destinations and cur and cur.get("forge") == "github":
                  git_repos.append(cur["repo"])
          if len(git_repos) != 1:
              sys.stderr.write(
                  "MirrorDestinationBoundaryError: .ops.yaml must declare exactly one "
                  "github destination (the mirror); refusing to push an ambiguous or "
                  "unconfigured mirror remote rather than silently choosing one.\n"
              )
              sys.exit(2)
          sys.stdout.write(git_repos[0] + "\n")
          PY
          )"
          remote="https://x-access-token:${GH_MIRROR_TOKEN}@github.com/${mirror_repo}.git"
          git push --force "$remote" "+${GITHUB_REF}:${GITHUB_REF}"
