name: Create Forgejo Release

# Forgejo is canonical; GitHub is the public mirror. This workflow no longer
# writes a release object itself — it gates the release, then hands publication
# to the ops-engine ReleaseHandler, which publishes to every destination in
# .ops.yaml and reports a partial publication instead of swallowing it.
#
# What this replaces, and why. The previous job built the release body from
# `git log --oneline` and assembled it with `printf "...%s" "$CHANGES"` after
# accumulating `"- ${line}\n"` in a shell variable. `printf %s` does not
# interpret escapes inside its argument, so every separator stayed a literal
# backslash-n: the v1.5.2 body was 4356 characters rendering as four lines of
# run-together commit subjects. It also posted to one forge only, which is how
# five tags (v1.3.12 through v1.5.2) reached GitHub with no release object at
# all while the public "latest release" stood at v1.3.11.
#
# The four defects and where each is now answered:
#   commit dump      -> the body is the CHANGELOG section for the tag
#   literal \n       -> the notes never pass through printf; they cross steps
#                       as a heredoc-delimited GITHUB_OUTPUT value
#   bare-tag title   -> the title gate, before any release object exists
#   one forge only   -> destinations come from .ops.yaml, both are published
#   invented mirror  -> the canonical tag ref is pushed onto the mirror before
#     tag               publication, and both tags are peeled and compared after

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to create release for (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      # The release title is a gate, not an agreement. It must conform to the
      # release_title_policy declared in .version.yaml — not a hardcoded product
      # name. A tag whose rendered title does not conform is refused here,
      # before any release object exists on either forge. Forge default behaviour
      # names a release after the bare tag — that is not the convention, and
      # v1.5.2's title had to be corrected by hand because of it.
      - name: Gate the release title
        id: title
        env:
          TAG_NAME: "${{ github.event.inputs.tag_name || github.ref_name }}"
        run: |
          set -euo pipefail

          python3 - "${TAG_NAME}" <<'TITLE_GATE_PY'
          import os
          import re
          import sys
          from pathlib import Path

          yaml_path = Path(".version.yaml")
          if not yaml_path.exists():
              sys.stderr.write(
                  "ReleaseTitlePolicyError: .version.yaml not found\n"
              )
              sys.exit(2)

          text = yaml_path.read_text("utf-8")

          m = re.search(r"^product_name:\s*(.+)$", text, re.MULTILINE)
          product_name = m.group(1).strip().strip("\"'") if m else ""
          if not product_name:
              sys.stderr.write(
                  "ReleaseTitlePolicyError: product_name not found or empty "
                  "in release_title_policy\n"
              )
              sys.exit(2)

          m = re.search(r"^pattern:\s*(.+)$", text, re.MULTILINE)
          pattern_raw = m.group(1).strip() if m else ""
          if (
              len(pattern_raw) >= 2
              and pattern_raw[0] == pattern_raw[-1]
              and pattern_raw[0] in ("'", '"')
          ):
              pattern_raw = pattern_raw[1:-1]
          if not pattern_raw:
              sys.stderr.write(
                  "ReleaseTitlePolicyError: pattern not found or empty "
                  "in release_title_policy\n"
              )
              sys.exit(2)

          full_pattern = pattern_raw.replace("{product}", product_name)
          try:
              NAME_RE = re.compile(full_pattern)
          except re.error as exc:
              sys.stderr.write(
                  "ReleaseTitlePolicyError: invalid regex %r: %s\n"
                  % (full_pattern, exc)
              )
              sys.exit(2)

          tag_name = sys.argv[1]
          release_name = "%s %s" % (product_name, tag_name)

          if not NAME_RE.match(release_name):
              sys.stderr.write(
                  "ReleaseTitleError: release name %r does not match the "
                  "required convention %r. Refusing before any release "
                  "object exists on either forge.\n"
                  % (release_name, full_pattern)
              )
              sys.exit(2)

          sys.stdout.write("title gate: %r conforms\n" % release_name)

          # GITHUB_OUTPUT is the GitHub Actions mechanism; always set in CI.
          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path:
              with open(output_path, "a") as fh:
                  fh.write("release_name=%s\n" % release_name)
                  fh.write("product_name=%s\n" % product_name)
          TITLE_GATE_PY

      # The release body is the CHANGELOG entry for this version, never commit
      # subjects. A tag whose version has no section fails here, before any
      # release object exists — which is the correct outcome: a release with no
      # authored notes is a release nobody can read.
      #
      # The extractor is a byte-for-byte copy of the one in ops-engine v3.4.0's
      # own release workflow, and it is stdlib-only on purpose: importing
      # ops_engine at this point would pull yaml and pydantic, which the bare
      # runner image does not carry. The heading pattern accepts every form
      # CHANGELOG.md uses: `## v1.5.2 (2026-09-02)`, `## v1.3.13 (2026-08-31) —
      # Dynamic Routing and Anti-Masking`, and the bracketed `## [2.1.2] — ...`.
      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          TAG_NAME: "${{ github.event.inputs.tag_name || github.ref_name }}"
        run: |
          set -euo pipefail

          NOTES="$(python3 - "$TAG_NAME" <<'PY'
          import re
          import sys

          HEADER_PATTERN = re.compile(
              r"^##\s+"
              r"(?:\[)?(?:[\w-]+\s+)?v?"
              r"(\d+\.\d+\.\d+(?:[-.\w]*)?)"
              r"(?:\])?"
              r".*$",
              re.MULTILINE,
          )

          tag = sys.argv[1]
          version = tag.lstrip("v")
          with open("CHANGELOG.md", encoding="utf-8") as fh:
              content = fh.read()
          matches = list(HEADER_PATTERN.finditer(content))
          target_match = None
          target_idx = -1
          for idx, m in enumerate(matches):
              if m.group(1) == version:
                  target_match = m
                  target_idx = idx
                  break
          if target_match is None:
              notes = ""
          else:
              start = target_match.end()
              if target_idx + 1 < len(matches):
                  end = matches[target_idx + 1].start()
              else:
                  end = len(content)
              notes = content[start:end].strip()
          if not notes:
              sys.stderr.write(
                  "MissingChangelogEntryError: no '## %s' section in CHANGELOG.md; "
                  "a release with no notes would post commit subjects, so the "
                  "release is refused.\n" % version
              )
              sys.exit(2)
          sys.stdout.write(notes)
          PY
          )"

          {
            echo "notes<<EOF"
            echo "${NOTES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Generic tooling lives in the open base. ops-engine is OSS and publicly
      # mirrored, so this needs no credential — the same fetch the version gate
      # in mirror.yml already uses.
      #
      # Pinned to the v3.7.0 tag.
      - name: Fetch the audience gate (canonical, ops-engine)
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://raw.githubusercontent.com/LangeVC/ops-engine/v3.7.0/scripts/release_notes_audience_gate.py" \
            -o "$RUNNER_TEMP/release_notes_audience_gate.py"

          # Prove what arrived. Without this the step reports success even when
          # it fetched an HTML page: a redirect to a login page returns 200 and
          # curl -f never triggers, so the failure surfaces later as a
          # SyntaxError on "<!DOCTYPE html>".
          python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" \
            "$RUNNER_TEMP/release_notes_audience_gate.py" \
            || { echo "fetched file is not Python — first three lines:"; \
                 head -3 "$RUNNER_TEMP/release_notes_audience_gate.py"; exit 1; }

      # The release body is addressed at an external reader. A section that
      # still names an internal ticket addresses the tracker that produced the
      # release, not the consumer the body is for.
      #
      # The engine classifies nothing by shape: the code-and-number form is
      # shared by internal ticket ids and by identifiers a reader legitimately
      # needs (CVE, RFC, ISO, PEP-8, UTF-8, SHA-256, TLS-1.3). It refuses a
      # ticket-shaped token only when its prefix appears in the vocabulary THIS
      # repository declares. That vocabulary is a committed file rather than a
      # shell literal because it was derived by measurement — the prefixes that
      # actually occur in this repository's commit subjects and changelog — and
      # a reviewer must be able to see and change the list.
      - name: Gate the release notes for an external audience
        env:
          NOTES: "${{ steps.notes.outputs.notes }}"
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          PREFIXES_FILE="$(mktemp)"
          trap 'rm -f "$NOTES_FILE" "$PREFIXES_FILE"' EXIT
          printf '%s\n' "$NOTES" > "$NOTES_FILE"
          python3 - "$PREFIXES_FILE" <<'PREFIXES_PY'
          import sys
          from pathlib import Path

          out = sys.argv[1]
          prefixes = []
          ops = Path(".ops.yaml")
          if ops.exists():
              for raw in ops.read_text(encoding="utf-8").splitlines():
                  line = raw.split("#", 1)[0].strip()
                  if not line.startswith("tracker_prefixes:"):
                      continue
                  value = line[len("tracker_prefixes:"):].strip()
                  if value.startswith("[") and value.endswith("]"):
                      value = value[1:-1]
                  for item in value.split(","):
                      item = item.strip().strip("'\"")
                      if item:
                          prefixes.append(item)
          Path(out).write_text("\n".join(prefixes) + ("\n" if prefixes else ""),
                               encoding="utf-8")
          PREFIXES_PY
          python3 "$RUNNER_TEMP/release_notes_audience_gate.py" \
            --ticket-prefixes "$PREFIXES_FILE" \
            "$NOTES_FILE"

      # The workflow calls the engine to publish; it does not reimplement
      # publication. ReleaseHandler.publish_release creates the release on EVERY
      # destination resolved from the committed .ops.yaml and reports a partial
      # publication rather than swallowing it — which is precisely the failure
      # that left five tags on GitHub with no release object.
      #
      # Two forges carry two credentials, so the adapter factory is given one
      # credential per forge value. A destination whose forge has no credential
      # is a named refusal, never a silent unauthenticated publication. The
      # webhook secret is empty on both: publication never parses a webhook, and
      # neither forge's ingress contract is exercised here.
      #
      # No assets are attached. This repository publishes no built distribution
      # — there is no PyPI claim, and distribution to the Capacium Exchange runs
      # from the mirror side. The directory is created and left empty so the
      # engine attaches nothing, rather than failing on a missing path.
      #
      # Ops CORE-ZR-026: the release assets are built in the step below, in this
      # same job, so the "left empty" note above predates it — the directory now
      # carries the wheel, the sdist and SHA256SUMS and the engine attaches them.
      # The build is deterministic: the wheel honours SOURCE_DATE_EPOCH and the
      # sdist is rewritten to carry the same epoch, so two builds of one tag are
      # byte-identical and a download is verified with `sha256sum -c SHA256SUMS`.
      - name: Build the release assets
        env:
          TAG_NAME: "${{ github.event.inputs.tag_name || github.ref_name }}"
        run: |
          set -euo pipefail

          rm -rf release-assets

          # The build runs in a venv so --no-isolation still finds the PEP 639
          # floor setuptools>=77 that the build backend declares; the directory
          # stays out of the source tree so it is never itself packaged.
          BUILD_VENV="$(mktemp -d)/build-venv"
          python3 -m venv "$BUILD_VENV"
          "$BUILD_VENV/bin/python" -m pip install --quiet \
            --disable-pip-version-check --use-pep517 build "setuptools>=77" wheel

          # SOURCE_DATE_EPOCH is the tag commit time — one instant for both the
          # annotated tag and the commit it names, so a rebuild is identical.
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "${TAG_NAME}^{}")"

          "$BUILD_VENV/bin/python" - "${TAG_NAME}" <<'BUILD_PY'
          import gzip
          import io
          import os
          import re
          import shutil
          import subprocess
          import sys
          import tarfile
          import zipfile

          tag = sys.argv[1]

          def project_fields(text):
              """Read name/version from the [project] table, nothing else."""
              in_project = False
              fields = {}
              for raw in text.splitlines():
                  line = raw.split("#", 1)[0].strip()
                  if line.startswith("[") and line.endswith("]"):
                      in_project = line == "[project]"
                      continue
                  if not in_project:
                      continue
                  key, sep, value = line.partition("=")
                  if sep and key.strip() in ("name", "version"):
                      fields[key.strip()] = value.strip().strip("\"'")
              return fields

          fields = project_fields(
              open("pyproject.toml", encoding="utf-8").read()
          )
          name = fields.get("name", "")
          version = fields.get("version", "")
          if not name or not version:
              sys.stderr.write(
                  "ReleaseVersionError: pyproject.toml [project] declares no "
                  "name/version; refusing to build release assets for %s.\n" % tag
              )
              sys.exit(2)
          if tag != "v" + version:
              sys.stderr.write(
                  "ReleaseVersionMismatchError: tag %s but pyproject.toml "
                  "declares version %s; refusing to build release assets that "
                  "do not name the tag they claim.\n" % (tag, version)
              )
              sys.exit(2)

          dist = "release-assets"
          subprocess.run(
              [sys.executable, "-m", "build", "--no-isolation",
               "--sdist", "--wheel", "--outdir", dist],
              check=True,
          )

          # The wheel honours SOURCE_DATE_EPOCH through setuptools; the sdist
          # does not, so it is rewritten to carry the epoch on every member and
          # in the gzip header. Without this, two builds differ.
          epoch = int(os.environ["SOURCE_DATE_EPOCH"])
          sdist = os.path.join(dist, "%s-%s.tar.gz" % (name, version))
          with tarfile.open(sdist, "r:gz") as src:
              members = [
                  (m, src.extractfile(m).read() if m.isreg() else None)
                  for m in src.getmembers()
              ]
          buf = io.BytesIO()
          with tarfile.open(fileobj=buf, mode="w",
                            format=tarfile.GNU_FORMAT) as out:
              for member, data in members:
                  member.mtime = epoch
                  member.uid = member.gid = 0
                  member.uname = member.gname = ""
                  out.addfile(
                      member, io.BytesIO(data) if data is not None else None
                  )
          with open(sdist, "wb") as fh:
              fh.write(gzip.compress(buf.getvalue(), mtime=epoch))

          # The artifact must name the version its own manifest declares, and
          # the directory must hold exactly the declared set — nothing extra,
          # nothing missing. Either check fails closed and leaves no files.
          wheel = os.path.join(
              dist, "%s-%s-py3-none-any.whl" % (name, version)
          )
          with zipfile.ZipFile(wheel) as zf:
              meta = zf.read(
                  "%s-%s.dist-info/METADATA" % (name, version)
              ).decode("utf-8")
          built = re.search(r"(?m)^Version:\s*(\S+)\s*$", meta)
          if built is None or built.group(1) != version:
              got = built.group(1) if built else "(absent)"
              sys.stderr.write(
                  "ReleaseVersionMismatchError: the built wheel records version "
                  "%s but pyproject.toml declares %s; refusing release assets "
                  "whose artifact disagrees with its own manifest.\n"
                  % (got, version)
              )
              shutil.rmtree(dist, ignore_errors=True)
              sys.exit(2)

          expected = {
              "%s-%s.tar.gz" % (name, version),
              "%s-%s-py3-none-any.whl" % (name, version),
          }
          actual = set(os.listdir(dist))
          if actual != expected:
              sys.stderr.write(
                  "UnexpectedReleaseAssetError: release-assets holds %s but the "
                  "declared release assets are %s; refusing a directory that "
                  "carries anything other than the declared artifacts.\n"
                  % (sorted(actual), sorted(expected))
              )
              shutil.rmtree(dist, ignore_errors=True)
              sys.exit(2)
          sys.stdout.write(
              "built release assets for %s: %s\n"
              % (version, ", ".join(sorted(expected)))
          )
          BUILD_PY

          # Relative names: the checksum file travels with the assets it lists.
          (cd release-assets && sha256sum *.tar.gz *.whl > SHA256SUMS)
          (cd release-assets && sha256sum -c SHA256SUMS)
      # The workflow calls the engine's entry point CLI to publish; it does not
      # reimplement publication. ops-engine-release-attach finds or creates the
      # release, converges it, attaches the built files and verifies the declared
      # asset set on every destination.
      #
      # Before the engine publishes, the canonical tag ref is pushed onto the
      # mirror with git, not a forge API, so the release API never gets the
      # chance to invent a tag at the mirror's default-branch HEAD.
      #
      # The engine wheel is not available until the engine is released (v3.7.0).
      # The install line below is correct for the released engine; the owner
      # merges these branches only after that release, so the line cannot be
      # tested until then.
      - name: Publish the release to every destination
        env:
          TAG_NAME: "${{ github.event.inputs.tag_name || github.ref_name }}"
          NOTES: "${{ steps.notes.outputs.notes }}"
          NAME_TEMPLATE: "${{ steps.title.outputs.product_name }} {tag_name}"
          FORGEJO_REPOSITORY: "${{ github.repository }}"
          FORGEJO_BASE_URL: "${{ github.server_url }}"
          FORGEJO_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GH_MIRROR_TOKEN: "${{ secrets.GH_MIRROR_TOKEN }}"
        run: |
          set -euo pipefail

          NOTES_FILE="$(mktemp)"
          trap 'rm -f "$NOTES_FILE"' EXIT
          printf '%s\n' "$NOTES" > "$NOTES_FILE"

          # The engine installs from the public wheel. This line is correct for
          # the released v3.7.0 wheel and cannot be tested until that release
          # exists.
          ENGINE_VENV="$(mktemp -d)/engine-venv"
          python3 -m venv "$ENGINE_VENV"
          "$ENGINE_VENV/bin/python" -m pip install --quiet \
            "https://github.com/LangeVC/ops-engine/releases/download/v3.7.0/ops_engine-3.7.0-py3-none-any.whl"

          # Prove what was installed.
          "$ENGINE_VENV/bin/python" -c "
import importlib.metadata as md, sys
REQUIRED = '3.7.0'
got = md.version('ops-engine')
if got != REQUIRED:
    sys.stderr.write('EngineVersionError: installed ops-engine %s, required %s.\n' % (got, REQUIRED))
    sys.exit(2)
sys.stdout.write('engine: ops-engine %s\n' % got)
"

          # Build a minimal config.yml from the Layer-3 .ops.yaml destinations.
          # Each destination carries its credential_variable so the CLI reads
          # the token from the runner's environment.
          python3 -c "
import os, sys
from pathlib import Path

sys.path.insert(0, os.path.join(os.path.dirname(__file__), 'src'))
from ops_engine.config_loader import load_ops_yaml, OpsYamlError

try:
    layer3 = load_ops_yaml('.')
except OpsYamlError as exc:
    print(f'::error::OpsYamlError: {exc}', file=sys.stderr)
    exit(2)
if layer3 is None:
    print('::error::MissingOpsYamlError: no .ops.yaml at the repository root.', file=sys.stderr)
    exit(2)
dests = layer3.destinations
if not dests:
    print('::error::MissingReleaseDestinationsError: .ops.yaml declares no destinations.', file=sys.stderr)
    exit(2)

org, _, repo_name = os.environ['FORGEJO_REPOSITORY'].partition('/')

_CREDENTIAL_VARS = {'forgejo': 'FORGEJO_TOKEN', 'github': 'GH_MIRROR_TOKEN'}

dest_list = []
for d in dests:
    entry = {'forge': d.forge, 'repo': d.repo, 'role': d.role, 'visibility': d.visibility}
    var = _CREDENTIAL_VARS.get(d.forge.strip().lower())
    if var:
        entry['credential_variable'] = var
    dest_list.append(entry)

config = {
    'orgs': {
        org: {
            'repositories': {
                repo_name: {
                    'destinations': dest_list
                }
            }
        }
    }
}
config_path = Path(os.environ['RUNNER_TEMP']) / 'release-config.yml'
with open(config_path, 'w') as fh:
    import yaml
    yaml.dump(config, fh, default_flow_style=False)
print(f'config written to {config_path}', file=sys.stderr)
"

          # Push the canonical tag onto the mirror with git first, so the
          # release API never gets to invent a tag at the mirror's default-branch
          # HEAD.
          mirror_repo="$(
            python3 -c "
import os, sys
from pathlib import Path
sys.path.insert(0, os.path.join(os.path.dirname(__file__), 'src'))
from ops_engine.config_loader import load_ops_yaml
layer3 = load_ops_yaml('.')
for d in layer3.destinations:
    if d.forge.strip().lower() == 'github':
        print(d.repo)
        break
"
          )"
          if [ -n "$mirror_repo" ]; then
            git push --force \
              "https://x-access-token:${GH_MIRROR_TOKEN}@github.com/${mirror_repo}.git" \
              "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          fi

          "$ENGINE_VENV/bin/python" -m ops_engine.release_attach \
            --config "$RUNNER_TEMP/release-config.yml" \
            --repo "$FORGEJO_REPOSITORY" \
            --tag "$TAG_NAME" \
            --artifacts release-assets \
            --repo-dir . \
            --name-template "$NAME_TEMPLATE" \
            --notes-file "$NOTES_FILE"
