# Contract CI — Cross-Repository Contract Validation
#
# Original: SW-160-CONTRACT-003. Requalified by SW-1510-SDK-CI.
#
# This workflow validates the contract boundary between SkillWeave Core, the
# SDK, and external consumers:
#
#   1. The SDK pin, the installed wheel's schema path, its canonical digest and
#      its ownership inventory are one consistent combination.
#   2. A fresh external consumer is green; a single declared schema drift makes
#      the consumer gate red on a *specific* assertion; restoration is green.
#   3. The gate records the dependency origins, the runner's declared
#      Python/platform compatibility, any collection error and every justified
#      skip. A historical allow-list of pre-existing failures is a pardon list,
#      never a clean release certificate.
#
# What SW-1510-SDK-CI repaired (source-confirmed contradictions):
#   * the consumer gate looked for ``<sdk>/schemas/*.schema.json`` while the SDK
#     ships ``skillweave_sdk/schemas/**`` and has no root ``schemas/``;
#   * the canonical digest it compared against was a flat-only string that
#     matches neither the SDK's own algorithm nor the installed wheel;
#   * the ownership inventory lived only in an unpublished source tree.
# The authoritative gate is now ``tests/unit/test_1510_sdk_ci.py``, which runs
# against the *installed wheel* built from the pinned SDK.
#
# SW-1591-CI-001: the "Resolve pinned SDK version" inline Python is indented to
# the block scalar's own indentation. Commit 16e95d5 fixed exactly these six
# lines; without them YAML parsing stops at the `import re` line and the whole
# workflow never runs (a false-green boundary).
#
# Publication hold: the published SDK tag ``v0.2.0`` predates the frozen
# execution/adapter contract set, so the gate pins the *qualified commit*
# (SDK_QUALIFIED_SHA) rather than the tag. The pin MUST be a commit that ships
# the ownership payload: the wheel at ``a663a947`` (the parent of the SDK
# candidate) carries no ``skillweave_sdk/_authority`` files, so the gate is RED
# at that pin. The pin is therefore the SDK candidate head that adds
# ``tool.setuptools.data-files``. When an authorized publisher cuts a tag that
# carries the frozen set, SDK_QUALIFIED_SHA may be replaced by that tag. This
# lane cannot publish; it can only name the qualified combination.

name: Contract CI — Cross-Repo Contract Validation

on:
  push:
    branches: [main, "feature/*", "ci/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The exact SDK commit qualified against the Core frozen canonical digest.
  # This must be a commit whose wheel ships skillweave_sdk/_authority; the
  # parent commit a663a947 does not, and the gate would be red at that pin.
  SDK_QUALIFIED_SHA: "bc86910c5a7c182ede598ebba750ca6cba0bfde6"
  # The frozen canonical digest of the full schema set (flat + execution +
  # adapter), computed with the SDK's own algorithm over the installed wheel.
  QUALIFIED_DIGEST: "3dd247f604017bac4ff37ff4f3e9b46c5d1bc48fc8ef225de88ec4b6d14d2e64"

jobs:
  contract-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: https://github.com/actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # `python -m build --no-isolation` runs the SDK's build backend in
          # this interpreter, so the PEP 639 floor the SDK declares
          # (setuptools>=77) must be present here, not fetched into an isolated
          # env that --no-isolation deliberately skips.
          pip install pytest PyYAML jsonschema referencing build "setuptools>=77" wheel

      - name: Resolve pinned SDK version from pyproject.toml
        id: sdk-pin
        run: |
          SDK_PIN="$(python3 -c "
          import re
          with open('pyproject.toml') as f:
              text = f.read()
          m = re.search(r'\"skillweave-sdk==([^\"]+)\"', text)
          print(m.group(1) if m else '')
          ")"
          if [ -z "${SDK_PIN}" ]; then
            echo "::error::Could not resolve skillweave-sdk pin from pyproject.toml"
            exit 1
          fi
          echo "SDK pin: ${SDK_PIN}"
          echo "version=${SDK_PIN}" >> "$GITHUB_OUTPUT"

      - name: Check out the qualified SDK from a published source
        env:
          SDK_VERSION: ${{ steps.sdk-pin.outputs.version }}
        run: |
          set -eu
          # Published sources, in authority order: Forgejo is canonical, the
          # GitHub mirror is read-only distribution. No sibling checkout, no
          # unpublished local path.
          SOURCES="git@git.langevc.com:skillweave/skillweave-sdk.git https://github.com/LangeVC/skillweave-sdk.git"
          CLONED=0
          for SOURCE in ${SOURCES}; do
            rm -rf /tmp/skillweave-sdk
            # Clone enough history to reach the qualified commit, then check
            # it out. A tag is recorded alongside for provenance, but the pin
            # is the exact commit: the tag may lag the frozen contract set.
            if git clone "${SOURCE}" /tmp/skillweave-sdk 2>/dev/null &&
               git -C /tmp/skillweave-sdk checkout "${SDK_QUALIFIED_SHA}" 2>/dev/null; then
              CLONED=1
            fi
            if [ "${CLONED}" -eq 1 ]; then
              echo "SDK resolved from published source: ${SOURCE}"
              break
            fi
          done
          if [ "${CLONED}" -ne 1 ]; then
            echo "::error::qualified SDK commit ${SDK_QUALIFIED_SHA} not found on any published source"
            exit 1
          fi
          SDK_SHA="$(git -C /tmp/skillweave-sdk rev-parse HEAD)"
          if [ "${SDK_SHA}" != "${SDK_QUALIFIED_SHA}" ]; then
            echo "::error::checked-out SDK ${SDK_SHA} is not the qualified ${SDK_QUALIFIED_SHA}"
            exit 1
          fi
          SDK_REMOTE="$(git -C /tmp/skillweave-sdk remote get-url origin)"
          SDK_TAG="$(git -C /tmp/skillweave-sdk describe --tags --exact-match 2>/dev/null || echo '(no exact tag)')"
          echo "SDK checked out at: ${SDK_SHA}"
          echo "SKILLWEAVE_SDK_DIR=/tmp/skillweave-sdk" >> "$GITHUB_ENV"
          echo "SKILLWEAVE_SDK_SHA=${SDK_SHA}" >> "$GITHUB_ENV"
          echo "SKILLWEAVE_SDK_REMOTE=${SDK_REMOTE}" >> "$GITHUB_ENV"
          echo "SKILLWEAVE_SDK_TAG=${SDK_TAG}" >> "$GITHUB_ENV"
          echo "SKILLWEAVE_SDK_PIN=${SDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verify SDK is from a published source (not a local checkout)
        run: |
          set -eu
          cd /tmp/skillweave-sdk
          REMOTE="$(git remote get-url origin)"
          case "${REMOTE}" in
            *github.com*|*forgejo*|*git.langevc.com*) echo "SDK origin: ${REMOTE} — published source" ;;
            *)
              echo "::error::SDK origin ${REMOTE} is not a published source"
              exit 1
              ;;
          esac

      - name: Record dependency origins and declared compatibility
        run: |
          set -eu
          echo "### Contract CI — qualified combination" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| field | value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| core commit | $(git rev-parse HEAD) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| sdk source (origin) | ${SKILLWEAVE_SDK_REMOTE} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| sdk qualified commit | ${SKILLWEAVE_SDK_SHA} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| sdk tag | ${SKILLWEAVE_SDK_TAG} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| sdk pin (pyproject) | skillweave-sdk==${SKILLWEAVE_SDK_PIN} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| frozen canonical digest | ${QUALIFIED_DIGEST} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| runner python | $(python3 -V 2>&1) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| runner platform | $(uname -srm) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # The compatibility the *gate* runs on and the compatibility Core
          # *declares* are both recorded, so a mismatch is visible.
          echo "Core declared compatibility:" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import re, tomllib
          data = tomllib.load(open("pyproject.toml", "rb"))
          proj = data["project"]
          print(f"- requires-python: {proj.get('requires-python')}")
          for c in proj.get("classifiers", []):
              if c.startswith("Programming Language :: Python"):
                  print(f"- classifier: {c}")
          PY
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tool origins:" >> "$GITHUB_STEP_SUMMARY"
          pip show pytest jsonschema referencing PyYAML \
            | awk '/^Name:|^Version:|^Location:/ {print "- " $0}' >> "$GITHUB_STEP_SUMMARY"

      - name: Run the cross-repo contract gate
        run: |
          set -eu
          # --continue-on-collection-errors: a collection error must be recorded
          #   as an ERROR node, never abort the run with every test "passed".
          # -rs: justified skips are printed with their reason.
          set +e
          python3 -m pytest tests/unit/test_1510_sdk_ci.py \
            -v --tb=short -rs --continue-on-collection-errors -p no:cacheprovider \
            2>&1 | tee /tmp/contract-gate.log
          RC=${PIPESTATUS[0]}
          set -e
          {
            echo "### Contract CI — gate result"
            echo ""
            echo '```'
            grep -E "collected|passed|failed|error|skipped|ERROR|FAILED|SKIPPED" /tmp/contract-gate.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The pytest EXIT CODE is the decisive verdict: a collection error, a
          # failure, and an unexpected skip-with-error all make it non-zero. The
          # grep below is a belt-and-braces name for the *collection* shape so a
          # reader of the log sees the specific cause. Newer pytest prints the
          # collection-error summary as ``ERROR tests/...`` (an ERROR node, which
          # the first pattern covers) and, on older/unformatted output, as an
          # ``_____ ERROR collecting <node> _____`` banner, which the second
          # pattern covers. Either way the run is red on the exit code alone.
          if grep -qE "^(ERROR|FAILED) |^_+ ERROR collecting" /tmp/contract-gate.log; then
            echo "::error::the contract gate recorded a collection error or failure"
            exit 1
          fi
          if [ "${RC}" -ne 0 ]; then
            echo "::error::contract gate failed (pytest exit ${RC})"
            exit 1
          fi

  # SW-1510-SDK-CI criterion 2: prove that a *declared* schema drift turns an
  # external-consumer run red on a SPECIFIC assertion under the same shell and
  # workflow as the green job above. This job must fail (the drift is
  # intentional); a green run here means the drift went undetected and Contract
  # CI is false-green.
  drift-counterproof:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: https://github.com/actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest PyYAML jsonschema referencing build "setuptools>=77" wheel

      - name: Check out the qualified SDK from a published source
        run: |
          set -eu
          SOURCES="git@git.langevc.com:skillweave/skillweave-sdk.git https://github.com/LangeVC/skillweave-sdk.git"
          CLONED=0
          for SOURCE in ${SOURCES}; do
            rm -rf /tmp/skillweave-sdk
            if git clone "${SOURCE}" /tmp/skillweave-sdk 2>/dev/null &&
               git -C /tmp/skillweave-sdk checkout "${SDK_QUALIFIED_SHA}" 2>/dev/null; then
              CLONED=1
            fi
            [ "${CLONED}" -eq 1 ] && break
          done
          if [ "${CLONED}" -ne 1 ]; then
            echo "::error::qualified SDK commit ${SDK_QUALIFIED_SHA} not found on any published source"
            exit 1
          fi
          echo "SKILLWEAVE_SDK_DIR=/tmp/skillweave-sdk" >> "$GITHUB_ENV"

      - name: Inject one declared drift into a frozen SDK schema
        run: |
          set -eu
          TARGET="/tmp/skillweave-sdk/src/skillweave_sdk/schemas/run-state.schema.json"
          if [ ! -f "${TARGET}" ]; then
            echo "::error::frozen schema not found at ${TARGET}"
            exit 1
          fi
          echo "Before: $(sha256sum "${TARGET}" | cut -d' ' -f1)"
          # A *declared* contract drift: one schema-semantic key added. The
          # canonical digest is over the sorted-key canonical JSON, so a bare
          # whitespace/byte edit is not a contract change — the drift must be a
          # declared schema edit, and it stays parseable so the failure is a
          # digest failure, not a JSON error.
          python3 - "${TARGET}" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          doc = json.loads(p.read_text(encoding="utf-8"))
          doc["$comment"] = "SW-1510-SDK-CI declared drift"
          p.write_text(json.dumps(doc, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          echo "After:  $(sha256sum "${TARGET}" | cut -d' ' -f1)"

      - name: Assert the drifted consumer run is red on the specific digest assertion
        run: |
          set -eu
          export SKILLWEAVE_SDK_DIR=/tmp/skillweave-sdk
          # The canonical-digest check covers every schema byte, so it is red
          # for exactly one reason here: the schema we just edited. Targeting
          # --k isolates the proof to the drift instead of riding on any
          # pre-existing red elsewhere in the suite.
          set +e
          python3 -m pytest tests/unit/test_1510_sdk_ci.py \
            -q -p no:cacheprovider \
            -k test_canonical_digest_algorithm_matches_installed_bytes 2>&1
          RC=$?
          set -e
          if [ "${RC}" -eq 0 ]; then
            echo "::error::Drifted SDK passed the consumer gate — false green"
            exit 1
          fi
          echo "Drift counterproof: declared schema drift detected, consumer gate red (pytest exit ${RC})"
          echo "### Contract CI — drift counterproof" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A declared edit to src/skillweave_sdk/schemas/run-state.schema.json turned the consumer gate red (pytest exit ${RC}) on test_canonical_digest_algorithm_matches_installed_bytes." >> "$GITHUB_STEP_SUMMARY"
