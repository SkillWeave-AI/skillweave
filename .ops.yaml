# Layer-3 repository override: the release destinations for this repository.
#
# The release workflow reads this file through ops_engine.config_loader.load_ops_yaml
# and resolves EVERY destination from it. Nothing here is restated as a literal in
# .forgejo/ — no forge repository, no API host, no CI variable. A release that
# reaches one forge and not the other is the failure this file exists to prevent:
# v1.3.12 through v1.5.2 were tagged on both forges while only Forgejo carried a
# release object, so the public "latest release" stood at v1.3.11 for nine days.
#
# The forge is a value, not a key name. Order is publication order.
destinations:
  - forge: forgejo
    repo: skillweave/skillweave
    role: release
    visibility: public
  - forge: github
    repo: SkillWeave-AI/skillweave
    role: release
    visibility: public

# This repository's tracker prefixes. The release workflow reads them from here and
# hands them to the audience gate, so no workflow carries a vocabulary as a literal.
# The gate classifies nothing by shape: the code-and-number form is shared by internal
# ticket ids and by identifiers a reader legitimately needs (CVE, RFC, ISO, PEP-8,
# UTF-8, SHA-256, TLS-1.3), so a ticket-shaped token is refused only when its prefix
# appears below. A repository that declares none gets no tracker check, which is the
# correct default rather than a hole.
#
# The list was measured, not guessed: these are the prefixes that actually occur in
# this repository's commit subjects and changelog. Run against the restored changelog
# it accepts 29 of 35 version sections and refuses six historical ones by name.
# Must stay on ONE line — the extractor reads a single `tracker_prefixes:` line.
tracker_prefixes: [ADR, ART, AUTH, BRIEF, CAT, CHAIN, CI, CLAIM, CN, DEPR, DEPS, DR, ENV, EPIC, FAI, FFR, GATE, GLE, GNF, IDEMP, LC, LIVE, LOCK, LVC, MODEL, OPT, ROUTE, RT, RTF, SCOPE, SKILL, STATE, SUITE, SVC, SW, UOW, VOCAB, XPA]
