# .version.yaml — declares every version-bearing surface in the SkillWeave
# product and the role each one plays, plus the release policy that binds them.
#
# This file is the single declarative input for the generic version-sync check
# and bump, and for release-gate tag validation. A tool that reads `locations`
# and honours `path`/`pattern`/`required` needs no other hardcoded inventory.
schema: 1

# release_policy names how the distinct artifact roles below relate to one
# another for this release train. `decoupled_member_pins` means the runtime
# product and the distribution bundle carry the train (release-tag) version,
# while every member artifact — the bundle's `capabilities[]` member pins AND
# each member's own skill_capability.yaml — is informational and may LAG the
# bundle: a bundle bump can be packaging alone (OPS decision 2026-09-02). The
# pin never diverges from its own member file though: both lag together, and
# that pin == file consistency is owned by scripts/check-manifest.py, not by
# this gate (loosening that check is out of scope for SW152-020).
release_policy: decoupled_member_pins

# The single authority whose version the bump reads as its reference and whose
# version the release tag is bound to.
source_of_truth: pyproject.toml

# Prose release history is NOT a version surface. CHANGELOG.md carries a prose
# heading per release and is written by hand; it is deliberately kept out of
# `locations` so an automatic bump can never rewrite history. Maintaining the
# CHANGELOG is a manual release-note responsibility, not an automated step.
# These are flat top-level scalars (not a nested map) because the canonical
# version-sync parser accepts only a restricted YAML subset: flat scalar keys
# and the `locations` list. A nested `changelog:` map would be unparseable.
# Release title policy — single declarative source for the release-naming
# convention consumed by releasechain and launch. The pattern MUST start with
# the product name (derived from pyproject.toml [project].name) followed by
# the version tag. Any skill, gate or agent that needs to validate a release
# title reads this pattern; the product name is NOT hardcoded in skill text.
# Missing or malformed policy must fail closed before any release object is
# created.
release_title_policy:
  # The product name for release titles. This MUST match pyproject.toml's
  # [project].name, title-cased (first letter uppercase, rest lowercase).
  # To rebrand, change only this value — no skill edits required.
  product_name: SkillWeave
  # Full regex that every release title must match. {product} is replaced
  # at consumption time with product_name above. The version comes from the
  # release tag (vX.Y.Z, optionally with -rcN prerelease suffix).
  pattern: '^{product} v[0-9]+\.[0-9]+\.[0-9]+(?:-rc[0-9]+)?$'
  description: "Release titles must be exactly '<product> vX.Y.Z' with no extra text. Prerelease suffixes (-rcN) are accepted."

changelog_path: CHANGELOG.md
changelog_managed: false
changelog_responsibility: manual

locations:
  # Runtime / product source.
  - path: pyproject.toml
    role: runtime_product
    pattern: '^version\s*=\s*"(\d+\.\d+\.\d+)"'
    required: true

  # Capacium distribution-bundle manifest (root capability.yaml).
  - path: capability.yaml
    role: distribution_bundle
    pattern: '^version:\s*(\S+)'
    required: true

  # The bundle's `capabilities[]` entries are dependency pins to member
  # skills, not the version authority for those skills. A member skill's
  # version may legitimately differ from the bundle's: a bundle bump can be
  # packaging alone (OPS decision 2026-09-02), and the pin lags the bundle
  # TOGETHER WITH the skill_capability entry for the same member, so the pin
  # never diverges from its own member file. The pin == file consistency is
  # owned by scripts/check-manifest.py (case 4 in validate-release-tag.yml),
  # never by this gate. This location is therefore informational, not lockstep;
  # version-sync must NOT force it equal to source_of_truth.
  - path: capability.yaml
    role: bundle_member_pins
    pattern: '^  version:\s*(\S+)'
    required: false

  # Every independently installable skill-capability artifact. One explicit
  # entry per shipped skill; each is a separate artifact in its own right.
  # Each skill_capability is informational together with its bundle_member_pins
  # slot: a packaging-only bump moves neither the member file nor the pin, so
  # the two stay consistent and both may lag the bundle version (OPS decision
  # 2026-09-02). version-sync must NOT force a skill file equal to
  # source_of_truth; its own version surface is its capability.yaml.
  - path: skills/skillweave-entry/capability.yaml
    role: skill_capability
    pattern: '^version:\s*(\S+)'
    required: false
  - path: skills/skillweave-blueprint/capability.yaml
    role: skill_capability
    pattern: '^version:\s*(\S+)'
    required: false
  - path: skills/skillweave-council/capability.yaml
    role: skill_capability
    pattern: '^version:\s*(\S+)'
    required: false
  - path: skills/skillweave-design/capability.yaml
    role: skill_capability
    pattern: '^version:\s*(\S+)'
    required: false
  - path: skills/skillweave-discovery/capability.yaml
    role: skill_capability
    pattern: '^version:\s*(\S+)'
    required: false
  - path: skills/skillweave-launch/capability.yaml
    role: skill_capability
