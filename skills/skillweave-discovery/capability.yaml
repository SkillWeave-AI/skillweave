kind: skill
name: skillweave-discovery
version: 1.3.11
description: Define and validate problems through stakeholder research, empathy mapping, evidence, and opportunity assessment.
author: SkillWeave Team
license: Apache-2.0
owner: LangeVC
repository: https://git.langevc.com/skillweave/skillweave
homepage: https://git.langevc.com/skillweave/skillweave
frameworks:
- opencode
- claude-code
- codex
- gemini-cli
- antigravity
- openclaw
- aider
- windsurf
- qwen
keywords:
- discovery
- research
- empathy
- problem-validation
- opportunity
# The declared lifecycle boundary of this prompt skill's Phase 2 (Research).
# This is data, not a command: the consumer materializes it into
# .skillweave/hooks/discovery-pre.yaml (skillweave.discovery.materialize_skill_binding),
# and the Studio hook engine loads the source-owned DiscoveryResearchHook at
# discovery/pre, driving registry-backed typed search -- so the Markdown facade
# actually reaches the AdapterRegistry instead of only describing it. The block
# embeds no credential value and denies egress by default.
studio_binding:
  phase: discovery
  position: pre
  module: skillweave.discovery.lifecycle_hook.DiscoveryResearchHook
  name: skillweave-discovery-research
  config:
    provider: duckduckgo
    allow_network: false
